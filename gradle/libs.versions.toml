[versions]
# plugins
benManesVersionsPlugin = "0.54.0"
detektPlugin = "2.0.0-alpha.5"
ktfmtPlugin = "0.26.0"
springBoot = "4.1.0"
kotlin = "2.4.0"

springDependencyManagementPlugin = "1.1.7"

# libraries
jackson = "3.2.1"
threeten = "1.10.0"

[libraries]
# libraries with unmanaged versions
threeten-extra = { module = "org.threeten:threeten-extra", version.ref = "threeten" }

# libraries whose versions are typically managed but which are constrained due to CVEs
jackson-databind = { module = "tools.jackson.core:jackson-databind", version.ref = "jackson" }

# libraries with managed versions
jackson-module-kotlin = { module = "tools.jackson.module:jackson-module-kotlin" }
spring-boot-configuration-processor = { module = "org.springframework.boot:spring-boot-configuration-processor" }
spring-boot-devtools = { module = "org.springframework.boot:spring-boot-devtools" }
spring-boot-starter-restclient = { module = "org.springframework.boot:spring-boot-starter-restclient" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }

[plugins]
benmanes-versions = { id = "com.github.ben-manes.versions", version.ref = "benManesVersionsPlugin" }
detekt = { id = "dev.detekt", version.ref = "detektPlugin" }
kapt = { id = "org.jetbrains.kotlin.kapt", version.ref = "kotlin" }
kotlin = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
ktfmt = { id = "com.ncorti.ktfmt.gradle", version.ref = "ktfmtPlugin" }
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-boot-dependencies = { id = "io.spring.dependency-management", version.ref = "springDependencyManagementPlugin" }
